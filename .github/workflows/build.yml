name: Auto Extract ZIP & Build Signed APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Uploaded ZIP or Bootstrap Phase 1 Project
        shell: python
        run: |
          import os, glob, zipfile, shutil, textwrap

          def write_file(path, content):
              os.makedirs(os.path.dirname(path) if os.path.dirname(path) else ".", exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(content).strip() + "\n")

          # ۱. بررسی وجود فایل زیپ و جایگزینی خودکار فایل‌های پروژه
          zip_files = glob.glob("*.zip")
          if zip_files:
              for zf in zip_files:
                  print(f"Extracting {zf}...")
                  os.makedirs("_temp_unzip", exist_ok=True)
                  with zipfile.ZipFile(zf, 'r') as z:
                      z.extractall("_temp_unzip")

                  source_dir = "_temp_unzip"
                  entries = [e for e in os.listdir(source_dir) if not e.startswith("__MACOSX")]
                  if len(entries) == 1 and os.path.isdir(os.path.join(source_dir, entries[0])):
                      if not os.path.exists(os.path.join(source_dir, "settings.gradle.kts")):
                          source_dir = os.path.join(source_dir, entries[0])

                  for item in os.listdir(source_dir):
                      if item in [".git", "keystore"]:
                          continue
                      s = os.path.join(source_dir, item)
                      d = os.path.join(".", item)
                      if os.path.isdir(s):
                          shutil.copytree(s, d, dirs_exist_ok=True)
                      else:
                          shutil.copy2(s, d)

                  shutil.rmtree("_temp_unzip", ignore_errors=True)
                  os.remove(zf)

          # ۲. ساخت خودکار فایل‌های فاز ۱
          if not os.path.exists("settings.gradle.kts") or not zip_files:
              print("Writing Phase 1 project files...")

              write_file("gradle.properties", """
                  org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
                  android.useAndroidX=true
                  kotlin.code.style=official
                  android.nonTransitiveRClass=true
              """)

              write_file("settings.gradle.kts", """
                  pluginManagement {
                      repositories {
                          google()
                          mavenCentral()
                          gradlePluginPortal()
                      }
                  }
                  dependencyResolutionManagement {
                      repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                      repositories {
                          google()
                          mavenCentral()
                          maven { url = uri("https://jitpack.io") }
                      }
                  }
                  rootProject.name = "MultiCoreVPN"
                  include(":app")
              """)

              write_file("build.gradle.kts", """
                  plugins {
                      id("com.android.application") version "8.5.2" apply false
                      id("org.jetbrains.kotlin.android") version "2.0.21" apply false
                      id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
                  }
              """)

              write_file("app/build.gradle.kts", """
                  plugins {
                      id("com.android.application")
                      id("org.jetbrains.kotlin.android")
                      id("org.jetbrains.kotlin.plugin.compose")
                  }

                  val runNumber = System.getenv("GITHUB_RUN_NUMBER")?.toIntOrNull() ?: 1

                  android {
                      namespace = "com.multivpn.app"
                      compileSdk = 34

                      defaultConfig {
                          applicationId = "com.multivpn.app"
                          minSdk = 24
                          targetSdk = 34
                          versionCode = runNumber
                          versionName = "1.0.$runNumber"
                      }

                      signingConfigs {
                          create("permanentSign") {
                              storeFile = rootProject.file("keystore/app.jks")
                              storePassword = "MultiVpnPassword123"
                              keyAlias = "multivpn"
                              keyPassword = "MultiVpnPassword123"
                          }
                      }

                      buildTypes {
                          debug {
                              signingConfig = signingConfigs.getByName("permanentSign")
                          }
                          release {
                              isMinifyEnabled = false
                              signingConfig = signingConfigs.getByName("permanentSign")
                          }
                      }

                      compileOptions {
                          sourceCompatibility = JavaVersion.VERSION_17
                          targetCompatibility = JavaVersion.VERSION_17
                      }

                      kotlinOptions {
                          jvmTarget = "17"
                      }

                      buildFeatures {
                          compose = true
                      }
                  }

                  dependencies {
                      val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
                      implementation(composeBom)
                      implementation("androidx.activity:activity-compose:1.9.0")
                      implementation("androidx.compose.ui:ui")
                      implementation("androidx.compose.material3:material3")
                      implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
                      implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
                      implementation("com.squareup.okhttp3:okhttp:4.12.0")
                      implementation("com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0")
                      implementation("androidx.security:security-crypto:1.1.0-alpha06")
                      implementation("org.bouncycastle:bcprov-jdk15to18:1.78.1")
                  }
              """)

              write_file("app/src/main/AndroidManifest.xml", """
                  <?xml version="1.0" encoding="utf-8"?>
                  <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                      <uses-permission android:name="android.permission.INTERNET" />
                      <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                      <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
                      <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
                      <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

                      <application
                          android:allowBackup="false"
                          android:icon="@android:drawable/sym_def_app_icon"
                          android:label="MultiCore VPN"
                          android:supportsRtl="true"
                          android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                          <activity
                              android:name=".MainActivity"
                              android:exported="true">
                              <intent-filter>
                                  <action android:name="android.intent.action.MAIN" />
                                  <category android:name="android.intent.category.LAUNCHER" />
                              </intent-filter>
                          </activity>

                          <service
                              android:name=".MultiCoreVpnService"
                              android:exported="false"
                              android:permission="android.permission.BIND_VPN_SERVICE"
                              android:foregroundServiceType="specialUse">
                              <intent-filter>
                                  <action android:name="android.net.VpnService" />
                              </intent-filter>
                              <property
                                  android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                                  android:value="vpn" />
                          </service>
                      </application>
                  </manifest>
              """)

              write_file("app/src/main/java/com/multivpn/app/MainActivity.kt", """
                  package com.multivpn.app

                  import android.content.Intent
                  import android.net.VpnService
                  import android.os.Bundle
                  import androidx.activity.ComponentActivity
                  import androidx.activity.compose.setContent
                  import androidx.compose.foundation.layout.*
                  import androidx.compose.material3.*
                  import androidx.compose.runtime.*
                  import androidx.compose.ui.Alignment
                  import androidx.compose.ui.Modifier
                  import androidx.compose.ui.unit.dp

                  class MainActivity : ComponentActivity() {
                      override fun onCreate(savedInstanceState: Bundle?) {
                          super.onCreate(savedInstanceState)
                          setContent {
                              MaterialTheme {
                                  Surface(
                                      modifier = Modifier.fillMaxSize(),
                                      color = MaterialTheme.colorScheme.background
                                  ) {
                                      SinglePageVpnScreen()
                                  }
                              }
                          }
                      }
                  }

                  @Composable
                  fun SinglePageVpnScreen() {
                      var selectedCore by remember { mutableStateOf("Auto (Smart)") }
                      var isConnected by remember { mutableStateOf(false) }
                      var statusText by remember { mutableStateOf("آماده اتصال") }
                      var expandCoreMenu by remember { mutableStateOf(false) }

                      val cores = listOf(
                          "Auto (Smart)",
                          "Sing-box (Xray)",
                          "AmneziaWG",
                          "OpenVPN",
                          "Psiphon",
                          "Tor"
                      )

                      Column(
                          modifier = Modifier
                              .fillMaxSize()
                              .padding(24.dp),
                          horizontalAlignment = Alignment.CenterHorizontally,
                          verticalArrangement = Arrangement.SpaceBetween
                      ) {
                          Card(modifier = Modifier.fillMaxWidth()) {
                              Column(modifier = Modifier.padding(16.dp)) {
                                  Text(text = "شناسه دستگاه: در حال آماده‌سازی (فاز ۲)")
                                  Spacer(modifier = Modifier.height(4.dp))
                                  Text(text = "اعتبار کد ۵ روزه: بررسی نشده")
                              }
                          }

                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Button(
                                  onClick = {
                                      isConnected = !isConnected
                                      statusText = if (isConnected) "متصل به $selectedCore" else "قطع شد"
                                  },
                                  modifier = Modifier.size(160.dp)
                              ) {
                                  Text(if (isConnected) "قطع اتصال" else "اتصال")
                              }
                              Spacer(modifier = Modifier.height(16.dp))
                              Text(text = statusText)
                          }

                          Column(
                              modifier = Modifier.fillMaxWidth(),
                              verticalArrangement = Arrangement.spacedBy(10.dp)
                          ) {
                              Box(modifier = Modifier.fillMaxWidth()) {
                                  OutlinedButton(
                                      onClick = { expandCoreMenu = true },
                                      modifier = Modifier.fillMaxWidth()
                                  ) {
                                      Text("هسته فعال: $selectedCore")
                                  }
                                  DropdownMenu(
                                      expanded = expandCoreMenu,
                                      onDismissRequest = { expandCoreMenu = false }
                                  ) {
                                      cores.forEach { core ->
                                          DropdownMenuItem(
                                              text = { Text(core) },
                                              onClick = {
                                                  selectedCore = core
                                                  expandCoreMenu = false
                                              }
                                          )
                                      }
                                  }
                              }

                              OutlinedButton(
                                  onClick = { statusText = "در حال تست پینگ کانفیگ‌ها..." },
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text("تست پینگ")
                              }

                              OutlinedButton(
                                  onClick = { statusText = "در حال دریافت کانفیگ‌ها از ساب‌لینک..." },
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text("بروزرسانی ساب‌لینک‌ها")
                              }
                          }
                      }
                  }

                  class MultiCoreVpnService : VpnService() {
                      override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                          return START_STICKY
                      }
                      override fun onRevoke() {
                          super.onRevoke()
                          stopSelf()
                      }
                  }
              """)

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Permanent Keystore (If Not Exists)
        run: |
          mkdir -p keystore
          if [ ! -f "keystore/app.jks" ]; then
            echo "Generating permanent signing keystore..."
            keytool -genkeypair -v \
              -keystore keystore/app.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias multivpn \
              -storepass MultiVpnPassword123 \
              -keypass MultiVpnPassword123 \
              -dname "CN=MultiVPN, OU=Dev, O=MultiVPN, L=Tehran, S=Tehran, C=IR"
          fi

      - name: Commit Extracted Files & Keystore to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update project files and permanent keystore [skip ci]"
            git pull --rebase || true
            git push || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Signed APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiCoreVPN-Signed-v${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
