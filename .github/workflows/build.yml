name: Build Full TUN MultiCore VPN (Telegram + Real HTTP Ping)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Full TUN & Batch Real HTTP Ping + Clean Workflow
        shell: python
        run: |
          import os, shutil

          if os.path.exists("telegram_bot"):
              shutil.rmtree("telegram_bot")

          def write_file(path, content):
              os.makedirs(os.path.dirname(path) if os.path.dirname(path) else ".", exist_ok=True)
              lines = content.strip("\n").split("\n")
              non_empty = [l for l in lines if l.strip()]
              min_indent = min((len(l) - len(l.lstrip())) for l in non_empty) if non_empty else 0
              cleaned = "\n".join(l[min_indent:] if len(l) >= min_indent else l for l in lines)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(cleaned + "\n")

          # 1. کلاس JNI رسمی برای اتصال کارت شبکه مجازی اندروید (TUN) به پورت SOCKS5 (برای تلگرام و تمام اپ‌ها)
          write_file("app/src/main/java/hev/htproxy/TProxyService.java", r"""
              package hev.htproxy;

              public class TProxyService {
                  static {
                      System.loadLibrary("hev-socks5-tunnel");
                  }

                  public static native void TProxyStartService(String configPath, int fd);
                  public static native void TProxyStopService();
                  public static native long[] TProxyGetStats();
              }
          """)

          # 2. فایل CoreConfigGenerator با قابلیت Batch Real HTTP Ping و کانفیگ hev-socks5-tunnel
          write_file("app/src/main/java/com/multivpn/app/core/CoreConfigGenerator.kt", r"""
              package com.multivpn.app.core

              import android.util.Base64
              import com.multivpn.app.sub.VpnConfig
              import org.json.JSONArray
              import org.json.JSONObject
              import java.net.URLDecoder

              object CoreConfigGenerator {
                  const val LOCAL_SOCKS_PORT = 10808
                  const val LOCAL_HTTP_PORT = 10809
                  const val BATCH_BASE_PORT = 11000

                  fun buildHevTunYaml(): String {
                      return """
                          tunnel:
                            mtu: 1500
                            ipv4: 10.10.0.2
                          socks5:
                            port: $LOCAL_SOCKS_PORT
                            address: 127.0.0.1
                            udp: 'udp'
                          misc:
                            task-stack-size: 81920
                            connect-timeout: 5000
                            read-write-timeout: 60000
                            log-level: none
                      """.trimIndent()
                  }

                  fun buildBatchPingXrayJson(batch: List<Pair<VpnConfig, String>>): String {
                      val root = JSONObject()
                      root.put("log", JSONObject().apply { put("loglevel", "none") })

                      val inbounds = JSONArray()
                      val outbounds = JSONArray()
                      val rules = JSONArray()

                      batch.forEachIndexed { index, (cfg, resolvedIp) ->
                          val port = BATCH_BASE_PORT + index
                          val inTag = "in-$index"
                          val outTag = "out-$index"

                          val outbound = buildMainOutbound(cfg, resolvedIp).apply {
                              put("tag", outTag)
                          }
                          outbounds.put(outbound)

                          inbounds.put(JSONObject().apply {
                              put("tag", inTag)
                              put("port", port)
                              put("listen", "127.0.0.1")
                              put("protocol", "http")
                          })

                          rules.put(JSONObject().apply {
                              put("type", "field")
                              put("inboundTag", JSONArray().put(inTag))
                              put("outboundTag", outTag)
                          })
                      }

                      root.put("inbounds", inbounds)
                      root.put("outbounds", outbounds)
                      root.put("routing", JSONObject().apply {
                          put("domainStrategy", "AsIs")
                          put("rules", rules)
                      })

                      return root.toString()
                  }

                  fun buildHysteria2Json(config: VpnConfig, resolvedHostIp: String): String {
                      val raw = config.rawConfig.trim()
                      val withoutScheme = raw.substringAfter("://").substringBefore("#")
                      val userPass = withoutScheme.substringBefore("@")
                      val authPassword = urlDecode(userPass.removeSuffix(":"))
                      val params = parseQueryParams(withoutScheme.substringAfter("?", ""))

                      val sni = params["sni"]?.ifBlank { null } ?: params["peer"]?.ifBlank { null } ?: config.host
                      val insecure = params["insecure"] == "1" || params["insecure"] == "true" || params["allowInsecure"] == "1"
                      val obfsType = params["obfs"] ?: ""
                      val obfsPassword = params["obfs-password"] ?: ""

                      val serverAddress = if (resolvedHostIp.contains(":")) "[$resolvedHostIp]:${config.port}" else "$resolvedHostIp:${config.port}"

                      return JSONObject().apply {
                          put("server", serverAddress)
                          put("auth", authPassword)
                          put("tls", JSONObject().apply {
                              put("sni", sni)
                              put("insecure", insecure)
                          })
                          if (obfsType.equals("salamander", ignoreCase = true) && obfsPassword.isNotBlank()) {
                              put("obfs", JSONObject().apply {
                                  put("type", "salamander")
                                  put("salamander", JSONObject().apply {
                                      put("password", obfsPassword)
                                  })
                              })
                          }
                          put("socks5", JSONObject().apply {
                              put("listen", "127.0.0.1:$LOCAL_SOCKS_PORT")
                          })
                          put("http", JSONObject().apply {
                              put("listen", "127.0.0.1:$LOCAL_HTTP_PORT")
                          })
                      }.toString(2)
                  }

                  fun buildXrayJson(config: VpnConfig, resolvedHostIp: String): String {
                      val root = JSONObject()
                      root.put("log", JSONObject().apply { put("loglevel", "error") })

                      val inbounds = JSONArray()
                      inbounds.put(JSONObject().apply {
                          put("tag", "socks-in")
                          put("port", LOCAL_SOCKS_PORT)
                          put("listen", "127.0.0.1")
                          put("protocol", "socks")
                          put("sniffing", JSONObject().apply {
                              put("enabled", true)
                              put("destOverride", JSONArray().put("http").put("tls"))
                          })
                          put("settings", JSONObject().apply {
                              put("auth", "noauth")
                              put("udp", true)
                          })
                      })
                      inbounds.put(JSONObject().apply {
                          put("tag", "http-in")
                          put("port", LOCAL_HTTP_PORT)
                          put("listen", "127.0.0.1")
                          put("protocol", "http")
                          put("sniffing", JSONObject().apply {
                              put("enabled", true)
                              put("destOverride", JSONArray().put("http").put("tls"))
                          })
                      })
                      root.put("inbounds", inbounds)

                      val outbounds = JSONArray()
                      outbounds.put(buildMainOutbound(config, resolvedHostIp))
                      outbounds.put(JSONObject().apply {
                          put("tag", "direct")
                          put("protocol", "freedom")
                      })
                      root.put("outbounds", outbounds)
                      return root.toString(2)
                  }

                  fun buildMainOutbound(config: VpnConfig, resolvedHostIp: String): JSONObject {
                      val raw = config.rawConfig.trim()
                      return when {
                          raw.startsWith("vless://", ignoreCase = true) -> parseVlessOutbound(raw, config.host, config.port, resolvedHostIp)
                          raw.startsWith("ss://", ignoreCase = true) -> parseShadowsocksOutbound(raw, resolvedHostIp, config.port)
                          raw.startsWith("vmess://", ignoreCase = true) -> parseVmessOutbound(raw, resolvedHostIp)
                          raw.startsWith("trojan://", ignoreCase = true) -> parseTrojanOutbound(raw, config.host, config.port, resolvedHostIp)
                          else -> throw Exception("پروتکل ${config.protocol} پشتیبانی نمی‌شود")
                      }
                  }

                  private fun parseVlessOutbound(raw: String, originalHost: String, port: Int, resolvedHostIp: String): JSONObject {
                      val withoutScheme = raw.substringAfter("://").substringBefore("#")
                      val uuid = urlDecode(withoutScheme.substringBefore("@").trim())
                      val params = parseQueryParams(withoutScheme.substringAfter("?", ""))
                      val encryption = params["encryption"]?.ifBlank { "none" } ?: "none"
                      val net = (params["type"] ?: "tcp").lowercase()
                      val flow = params["flow"] ?: ""

                      val userObj = JSONObject().apply {
                          put("id", uuid)
                          put("encryption", encryption)
                          if (flow.isNotBlank() && (net == "tcp" || net == "raw")) {
                              put("flow", flow)
                          }
                      }
                      val vnextObj = JSONObject().apply {
                          put("address", resolvedHostIp)
                          put("port", port)
                          put("users", JSONArray().put(userObj))
                      }
                      return JSONObject().apply {
                          put("tag", "proxy")
                          put("protocol", "vless")
                          put("settings", JSONObject().apply { put("vnext", JSONArray().put(vnextObj)) })
                          put("streamSettings", buildStreamSettings(params, originalHost))
                      }
                  }

                  private fun parseTrojanOutbound(raw: String, originalHost: String, port: Int, resolvedHostIp: String): JSONObject {
                      val withoutScheme = raw.substringAfter("://").substringBefore("#")
                      val password = urlDecode(withoutScheme.substringBefore("@").trim())
                      val params = parseQueryParams(withoutScheme.substringAfter("?", ""))
                      val serverObj = JSONObject().apply {
                          put("address", resolvedHostIp)
                          put("port", port)
                          put("password", password)
                      }
                      return JSONObject().apply {
                          put("tag", "proxy")
                          put("protocol", "trojan")
                          put("settings", JSONObject().apply { put("servers", JSONArray().put(serverObj)) })
                          put("streamSettings", buildStreamSettings(params, originalHost, defaultSecurity = "tls"))
                      }
                  }

                  private fun parseShadowsocksOutbound(raw: String, resolvedHostIp: String, fallbackPort: Int): JSONObject {
                      val withoutScheme = raw.substringAfter("://").substringBefore("#")
                      val mainPart = withoutScheme.substringBefore("?")
                      val params = parseQueryParams(withoutScheme.substringAfter("?", ""))

                      var method = ""
                      var password = ""
                      var port = fallbackPort

                      if (mainPart.contains("@")) {
                          val userInfoRaw = urlDecode(mainPart.substringBeforeLast("@").trim())
                          val hostPort = mainPart.substringAfterLast("@").substringBefore("/")
                          port = hostPort.substringAfterLast(":", "$fallbackPort").toIntOrNull() ?: fallbackPort

                          if (userInfoRaw.contains(":") && !isLikelyBase64(userInfoRaw)) {
                              method = userInfoRaw.substringBefore(":").trim()
                              password = userInfoRaw.substringAfter(":").trim()
                          } else {
                              val decodedUser = decodeBase64Safe(userInfoRaw)
                              method = decodedUser.substringBefore(":").trim()
                              password = decodedUser.substringAfter(":").trim()
                          }
                      } else {
                          val decodedAll = decodeBase64Safe(urlDecode(mainPart.substringBefore("/").trim()))
                          val userPart = decodedAll.substringBeforeLast("@")
                          val hostPort = decodedAll.substringAfterLast("@")
                          method = userPart.substringBefore(":").trim()
                          password = userPart.substringAfter(":").trim()
                          port = hostPort.substringAfterLast(":", "$fallbackPort").toIntOrNull() ?: fallbackPort
                      }

                      val normalizedMethod = when (method.lowercase()) {
                          "aes-128-cfb", "aes-192-cfb", "aes-256-cfb", "rc4-md5", "bf-cfb" -> "aes-256-gcm"
                          "chacha20" -> "chacha20-ietf-poly1305"
                          else -> method.lowercase()
                      }

                      val serverObj = JSONObject().apply {
                          put("address", resolvedHostIp)
                          put("port", port)
                          put("method", normalizedMethod)
                          put("password", password)
                      }
                      return JSONObject().apply {
                          put("tag", "proxy")
                          put("protocol", "shadowsocks")
                          put("settings", JSONObject().apply { put("servers", JSONArray().put(serverObj)) })
                          if (params.containsKey("type") || params.containsKey("security")) {
                              put("streamSettings", buildStreamSettings(params, resolvedHostIp))
                          }
                      }
                  }

                  private fun isLikelyBase64(s: String): Boolean {
                      return !s.contains(":") && s.matches(Regex("^[A-Za-z0-9+_=-]+$"))
                  }

                  private fun parseVmessOutbound(raw: String, resolvedHostIp: String): JSONObject {
                      val b64 = raw.substringAfter("://").substringBefore("#").trim()
                      val j = JSONObject(decodeBase64Safe(b64))
                      val originalHost = j.optString("add", "").trim()
                      val port = j.optString("port", "443").toIntOrNull() ?: j.optInt("port", 443)
                      val id = j.optString("id", "").trim()
                      val aid = j.optString("aid", "0").toIntOrNull() ?: 0
                      val scy = j.optString("scy", "auto").ifBlank { "auto" }
                      val net = j.optString("net", "tcp").ifBlank { "tcp" }.lowercase()
                      val tls = j.optString("tls", "none").lowercase()
                      val sni = j.optString("sni", originalHost).ifBlank { originalHost }
                      val wsHost = j.optString("host", originalHost).ifBlank { originalHost }
                      val path = j.optString("path", "/").ifBlank { "/" }
                      val typeHeader = j.optString("type", "none").ifBlank { "none" }

                      val userObj = JSONObject().apply {
                          put("id", id)
                          put("alterId", aid)
                          put("security", scy)
                      }
                      val vnextObj = JSONObject().apply {
                          put("address", resolvedHostIp)
                          put("port", port)
                          put("users", JSONArray().put(userObj))
                      }
                      val params = mapOf(
                          "type" to net,
                          "security" to if (tls == "tls") "tls" else "none",
                          "sni" to sni,
                          "host" to wsHost,
                          "path" to path,
                          "headerType" to typeHeader,
                          "serviceName" to path.removePrefix("/")
                      )
                      return JSONObject().apply {
                          put("tag", "proxy")
                          put("protocol", "vmess")
                          put("settings", JSONObject().apply { put("vnext", JSONArray().put(vnextObj)) })
                          put("streamSettings", buildStreamSettings(params, originalHost))
                      }
                  }

                  private fun buildStreamSettings(params: Map<String, String>, originalHost: String, defaultSecurity: String = "none"): JSONObject {
                      val rawNet = (params["type"] ?: "tcp").lowercase()
                      val net = when (rawNet) {
                          "httpupgrade" -> "httpupgrade"
                          "splithttp", "xhttp" -> "splithttp"
                          "ws", "websocket" -> "ws"
                          "grpc", "gun" -> "grpc"
                          else -> "tcp"
                      }
                      val security = (params["security"] ?: defaultSecurity).lowercase()
                      val sni = params["sni"]?.ifBlank { null } ?: params["host"]?.ifBlank { null } ?: originalHost
                      val fp = params["fp"]?.ifBlank { "chrome" } ?: "chrome"
                      val pbk = params["pbk"] ?: ""
                      val sid = params["sid"] ?: ""
                      val spx = params["spx"] ?: "/"
                      val path = params["path"]?.ifBlank { "/" } ?: "/"
                      val wsHost = params["host"]?.ifBlank { originalHost } ?: originalHost
                      val serviceName = params["serviceName"] ?: ""
                      val headerType = params["headerType"] ?: "none"

                      return JSONObject().apply {
                          put("network", net)
                          put("security", if (security == "tls" || security == "reality") security else "none")
                          if (security == "tls") {
                              put("tlsSettings", JSONObject().apply {
                                  put("serverName", sni)
                                  put("fingerprint", fp)
                              })
                          } else if (security == "reality") {
                              put("realitySettings", JSONObject().apply {
                                  put("serverName", sni)
                                  put("fingerprint", fp)
                                  put("publicKey", pbk)
                                  put("shortId", sid)
                                  put("spiderX", spx)
                              })
                          }
                          when (net) {
                              "ws" -> put("wsSettings", JSONObject().apply {
                                  put("path", path)
                                  put("headers", JSONObject().apply { put("Host", wsHost) })
                              })
                              "httpupgrade" -> put("httpupgradeSettings", JSONObject().apply {
                                  put("path", path)
                                  put("host", wsHost)
                              })
                              "splithttp" -> put("splithttpSettings", JSONObject().apply {
                                  put("path", path)
                                  put("host", wsHost)
                              })
                              "grpc" -> put("grpcSettings", JSONObject().apply { put("serviceName", serviceName) })
                              "tcp" -> if (headerType.equals("http", ignoreCase = true)) {
                                  put("tcpSettings", JSONObject().apply {
                                      put("header", JSONObject().apply {
                                          put("type", "http")
                                          put("request", JSONObject().apply {
                                              put("path", JSONArray().put(path))
                                              put("headers", JSONObject().apply { put("Host", JSONArray().put(wsHost)) })
                                          })
                                      })
                                  })
                              }
                          }
                      }
                  }

                  private fun parseQueryParams(query: String): Map<String, String> {
                      val map = mutableMapOf<String, String>()
                      if (query.isBlank()) return map
                      for (pair in query.split("&")) {
                          if (pair.isBlank()) continue
                          map[urlDecode(pair.substringBefore("="))] = urlDecode(pair.substringAfter("=", ""))
                      }
                      return map
                  }

                  private fun urlDecode(str: String): String = try { URLDecoder.decode(str, "UTF-8") } catch (_: Exception) { str }

                  private fun decodeBase64Safe(input: String): String {
                      val clean = input.filterNot { it.isWhitespace() }
                      val padded = clean.padEnd((clean.length + 3) / 4 * 4, '=')
                      return try {
                          String(Base64.decode(padded, Base64.URL_SAFE), Charsets.UTF_8)
                      } catch (_: Exception) {
                          String(Base64.decode(padded, Base64.DEFAULT), Charsets.UTF_8)
                      }
                  }
              }
          """)

          # 3. فایل CoreEngineRunner
          write_file("app/src/main/java/com/multivpn/app/core/CoreEngineRunner.kt", r"""
              package com.multivpn.app.core

              import android.content.Context
              import com.multivpn.app.sub.VpnConfig
              import kotlinx.coroutines.Dispatchers
              import kotlinx.coroutines.delay
              import kotlinx.coroutines.withContext
              import okhttp3.OkHttpClient
              import okhttp3.Request
              import org.json.JSONObject
              import java.io.File
              import java.net.InetAddress
              import java.net.InetSocketAddress
              import java.net.Proxy
              import java.net.Socket
              import java.util.concurrent.ConcurrentHashMap
              import java.util.concurrent.TimeUnit

              object CoreEngineRunner {
                  @Volatile
                  private var coreProcess: Process? = null

                  @Volatile
                  var lastErrorLog: String = ""

                  private val dnsCache = ConcurrentHashMap<String, String>()

                  private val dohResolveClient = OkHttpClient.Builder()
                      .connectTimeout(3, TimeUnit.SECONDS)
                      .readTimeout(3, TimeUnit.SECONDS)
                      .build()

                  suspend fun startCore(context: Context, config: VpnConfig): Boolean = withContext(Dispatchers.IO) {
                      stopCore()
                      lastErrorLog = ""

                      try {
                          val resolvedIp = resolveHostToIp(config.host.removeSurrounding("[", "]"))
                          val nativeDir = context.applicationInfo.nativeLibraryDir

                          val isHysteria2 = config.protocol.equals("hy2", ignoreCase = true) ||
                              config.rawConfig.startsWith("hy2://", ignoreCase = true) ||
                              config.rawConfig.startsWith("hysteria2://", ignoreCase = true)

                          val pb = if (isHysteria2) {
                              val hyBinary = File(nativeDir, "libhysteria.so")
                              if (!hyBinary.exists()) {
                                  lastErrorLog = "فایل هسته libhysteria.so یافت نشد!"
                                  return@withContext false
                              }
                              hyBinary.setExecutable(true)
                              val configFile = File(context.filesDir, "active_hy2.json")
                              configFile.writeText(CoreConfigGenerator.buildHysteria2Json(config, resolvedIp), Charsets.UTF_8)
                              ProcessBuilder(hyBinary.absolutePath, "client", "-c", configFile.absolutePath)
                          } else {
                              val xrayBinary = File(nativeDir, "libxray.so")
                              if (!xrayBinary.exists()) {
                                  lastErrorLog = "فایل هسته libxray.so یافت نشد!"
                                  return@withContext false
                              }
                              xrayBinary.setExecutable(true)
                              val configFile = File(context.filesDir, "active_xray.json")
                              configFile.writeText(CoreConfigGenerator.buildXrayJson(config, resolvedIp), Charsets.UTF_8)
                              ProcessBuilder(xrayBinary.absolutePath, "run", "-c", configFile.absolutePath).apply {
                                  environment()["XRAY_LOCATION_ASSET"] = nativeDir
                              }
                          }

                          pb.directory(context.filesDir)
                          pb.redirectErrorStream(true)
                          coreProcess = pb.start()

                          for (i in 0 until 20) {
                              delay(200L)
                              if (isLocalPortListening(CoreConfigGenerator.LOCAL_SOCKS_PORT)) {
                                  delay(300L)
                                  return@withContext true
                              }
                              val exitVal = try { coreProcess?.exitValue() } catch (_: Exception) { null }
                              if (exitVal != null) break
                          }

                          val exitVal = try { coreProcess?.exitValue() } catch (_: Exception) { null }
                          if (exitVal != null) {
                              val fullOut = coreProcess?.inputStream?.bufferedReader()?.readText()?.trim() ?: ""
                              val cleanErr = fullOut.lines().filterNot {
                                  it.contains("Xray ") || it.contains("unified platform") || it.contains("Reading config:")
                              }.joinToString(" ").takeLast(220)
                              lastErrorLog = "خطای هسته: ${cleanErr.ifBlank { fullOut.takeLast(200) }}"
                              return@withContext false
                          }
                          true
                      } catch (e: Exception) {
                          lastErrorLog = "خطا در آماده‌سازی کانفیگ: ${e.message}"
                          false
                      }
                  }

                  fun resolveHostToIp(host: String): String {
                      val clean = host.removeSurrounding("[", "]").trim()
                      if (clean.matches(Regex("^\\d+\\.\\d+\\.\\d+\\.\\d+$")) || clean.contains(":")) return clean
                      dnsCache[clean]?.let { return it }

                      try {
                          val ip = InetAddress.getByName(clean).hostAddress
                          if (!ip.isNullOrBlank() && !ip.startsWith("10.") && !ip.startsWith("127.")) {
                              dnsCache[clean] = ip
                              return ip
                          }
                      } catch (_: Exception) {}

                      try {
                          val req = Request.Builder()
                              .url("https://1.1.1.1/dns-query?name=$clean&type=A")
                              .header("Accept", "application/dns-json")
                              .build()
                          dohResolveClient.newCall(req).execute().use { resp ->
                              val body = resp.body?.string() ?: return clean
                              val answers = JSONObject(body).optJSONArray("Answer") ?: return clean
                              for (i in 0 until answers.length()) {
                                  val item = answers.getJSONObject(i)
                                  if (item.optInt("type") == 1) {
                                      val data = item.optString("data", "")
                                      if (data.isNotBlank()) {
                                          dnsCache[clean] = data
                                          return data
                                      }
                                  }
                              }
                          }
                      } catch (_: Exception) {}
                      return clean
                  }

                  fun stopCore() {
                      try {
                          coreProcess?.destroy()
                          coreProcess?.destroyForcibly()
                      } catch (_: Exception) {
                      } finally {
                          coreProcess = null
                      }
                  }

                  fun isCoreRunning(): Boolean {
                      val proc = coreProcess ?: return false
                      return try {
                          proc.exitValue()
                          false
                      } catch (e: IllegalThreadStateException) {
                          true
                      }
                  }

                  fun isLocalPortListening(port: Int): Boolean {
                      return try {
                          Socket().use { s ->
                              s.connect(InetSocketAddress("127.0.0.1", port), 200)
                              true
                          }
                      } catch (_: Exception) {
                          false
                      }
                  }

                  suspend fun measureRealTunnelDelay(httpPort: Int = CoreConfigGenerator.LOCAL_HTTP_PORT, timeoutSec: Long = 4): Long = withContext(Dispatchers.IO) {
                      val testUrls = listOf(
                          "http://cp.cloudflare.com/generate_204",
                          "http://www.gstatic.com/generate_204"
                      )
                      val proxy = Proxy(Proxy.Type.HTTP, InetSocketAddress("127.0.0.1", httpPort))
                      val client = OkHttpClient.Builder()
                          .proxy(proxy)
                          .connectTimeout(timeoutSec, TimeUnit.SECONDS)
                          .readTimeout(timeoutSec, TimeUnit.SECONDS)
                          .build()

                      for (url in testUrls) {
                          try {
                              val start = System.currentTimeMillis()
                              val req = Request.Builder().url(url).build()
                              client.newCall(req).execute().use { resp ->
                                  if (resp.code == 204 || resp.isSuccessful) {
                                      val elapsed = System.currentTimeMillis() - start
                                      return@withContext if (elapsed <= 0L) 1L else elapsed
                                  }
                              }
                          } catch (_: Exception) {
                          }
                      }
                      -2L
                  }
              }
          """)

          # 4. فایل PingTester با تست Real HTTP روی کل ساب‌لینک
          write_file("app/src/main/java/com/multivpn/app/sub/PingTester.kt", r"""
              package com.multivpn.app.sub

              import android.content.Context
              import com.multivpn.app.core.CoreConfigGenerator
              import com.multivpn.app.core.CoreEngineRunner
              import kotlinx.coroutines.Dispatchers
              import kotlinx.coroutines.async
              import kotlinx.coroutines.awaitAll
              import kotlinx.coroutines.coroutineScope
              import kotlinx.coroutines.delay
              import kotlinx.coroutines.sync.Semaphore
              import kotlinx.coroutines.sync.withPermit
              import kotlinx.coroutines.withContext
              import java.io.File
              import java.net.InetSocketAddress
              import java.net.Socket

              object PingTester {
                  private val tcpSemaphore = Semaphore(25)

                  private suspend fun isServerReachable(host: String, port: Int, timeoutMs: Int = 1400): Boolean = withContext(Dispatchers.IO) {
                      try {
                          Socket().use { socket ->
                              socket.connect(InetSocketAddress(host.removeSurrounding("[", "]"), port), timeoutMs)
                          }
                          true
                      } catch (_: Exception) {
                          false
                      }
                  }

                  suspend fun pingAllConfigsRealHttp(
                      context: Context,
                      configs: List<VpnConfig>,
                      onProgress: (String) -> Unit = {}
                  ): List<VpnConfig> = withContext(Dispatchers.IO) {
                      val nativeDir = context.applicationInfo.nativeLibraryDir
                      val xrayBinary = File(nativeDir, "libxray.so")
                      if (!xrayBinary.exists()) return@withContext configs
                      xrayBinary.setExecutable(true)

                      onProgress("گام ۱/۲: غربالگری سرورهای روشن (${configs.size} کانفیگ)...")

                      val reachableMap = coroutineScope {
                          configs.map { cfg ->
                              async {
                                  tcpSemaphore.withPermit {
                                      val ok = isServerReachable(cfg.host, cfg.port)
                                      cfg.id to ok
                                  }
                              }
                          }.awaitAll().toMap()
                      }

                      val aliveXrayConfigs = configs.filter {
                          reachableMap[it.id] == true && !it.protocol.equals("hy2", ignoreCase = true)
                      }
                      val realPingResults = mutableMapOf<String, Long>()

                      val batches = aliveXrayConfigs.chunked(20)
                      batches.forEachIndexed { batchIdx, batch ->
                          onProgress("گام ۲/۲: تست Real HTTP دسته‌ای (${batchIdx + 1} از ${batches.size})...")

                          val validPairs = mutableListOf<Pair<VpnConfig, String>>()
                          for (cfg in batch) {
                              try {
                                  val ip = CoreEngineRunner.resolveHostToIp(cfg.host)
                                  CoreConfigGenerator.buildMainOutbound(cfg, ip)
                                  validPairs.add(cfg to ip)
                              } catch (_: Exception) {
                                  realPingResults[cfg.id] = -2L
                              }
                          }

                          if (validPairs.isNotEmpty()) {
                              var batchProcess: Process? = null
                              try {
                                  val batchJson = CoreConfigGenerator.buildBatchPingXrayJson(validPairs)
                                  val batchFile = File(context.filesDir, "batch_ping.json")
                                  batchFile.writeText(batchJson, Charsets.UTF_8)

                                  val pb = ProcessBuilder(xrayBinary.absolutePath, "run", "-c", batchFile.absolutePath).apply {
                                      environment()["XRAY_LOCATION_ASSET"] = nativeDir
                                      directory(context.filesDir)
                                      redirectErrorStream(true)
                                  }
                                  batchProcess = pb.start()

                                  for (w in 0 until 12) {
                                      delay(150L)
                                      if (CoreEngineRunner.isLocalPortListening(CoreConfigGenerator.BATCH_BASE_PORT)) break
                                  }

                                  coroutineScope {
                                      validPairs.mapIndexed { idx, (cfg, _) ->
                                          async {
                                              val port = CoreConfigGenerator.BATCH_BASE_PORT + idx
                                              val delayMs = CoreEngineRunner.measureRealTunnelDelay(httpPort = port, timeoutSec = 4)
                                              realPingResults[cfg.id] = delayMs
                                          }
                                      }.awaitAll()
                                  }
                              } catch (_: Exception) {
                              } finally {
                                  try {
                                      batchProcess?.destroy()
                                      batchProcess?.destroyForcibly()
                                  } catch (_: Exception) {}
                              }
                          }
                      }

                      val finalConfigs = configs.map { cfg ->
                          val realPing = realPingResults[cfg.id] ?: -2L
                          cfg.copy(pingMs = realPing)
                      }

                      finalConfigs.sortedWith(compareBy {
                          when {
                              it.pingMs > 0 -> it.pingMs
                              it.pingMs == -1L -> 999998L
                              else -> 999999L
                          }
                      })
                  }
              }
          """)

          # 5. فایل MainActivity با سرویس Full TUN (TProxyService) برای باز شدن اتوماتیک تلگرام و تمام اپ‌ها
