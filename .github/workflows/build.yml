name: Build From Uploaded ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Uploaded ZIP
        shell: python
        run: |
          import os, glob, zipfile, shutil
          zip_files = glob.glob("*.zip")
          for zf in zip_files:
              print(f"Extracting {zf}...")
              os.makedirs("_temp_unzip", exist_ok=True)
              with zipfile.ZipFile(zf, 'r') as z:
                  z.extractall("_temp_unzip")
              
              source_dir = "_temp_unzip"
              entries = [e for e in os.listdir(source_dir) if not e.startswith("__MACOSX")]
              if len(entries) == 1 and os.path.isdir(os.path.join(source_dir, entries[0])):
                  source_dir = os.path.join(source_dir, entries[0])

              for item in os.listdir(source_dir):
                  if item in [".git", "keystore"]:
                      continue
                  s = os.path.join(source_dir, item)
                  d = os.path.join(".", item)
                  if os.path.isdir(s):
                      shutil.copytree(s, d, dirs_exist_ok=True)
                  else:
                      shutil.copy2(s, d)

              shutil.rmtree("_temp_unzip", ignore_errors=True)
              os.remove(zf)

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Permanent Keystore
        run: |
          mkdir -p keystore
          if [ ! -f "keystore/app.jks" ]; then
            keytool -genkeypair -v -keystore keystore/app.jks -keyalg RSA -keysize 2048 -validity 10000 -alias multivpn -storepass MultiVpnPassword123 -keypass MultiVpnPassword123 -dname "CN=MultiVPN"
          fi

      - name: Commit Extracted Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update from uploaded zip [skip ci]"
            git pull --rebase || true
            git push || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Signed APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MultiCoreVPN-Signed
          path: app/build/outputs/apk/debug/*.apk
