                        path: app/build/outputs/apk/debug/*.apk
          """)

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Permanent Keystore
        run: |
          mkdir -p keystore
          if [ ! -f "keystore/app.jks" ]; then
            keytool -genkeypair -v -keystore keystore/app.jks -keyalg RSA -keysize 2048 -validity 10000 -alias multivpn -storepass MultiVpnPassword123 -keypass MultiVpnPassword123 -dname "CN=MultiVPN"
          fi

      - name: Commit Updated Code & Clean Workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Add Full TUN (hev-socks5-tunnel), Batch Real HTTP Ping and clean build.yml [skip ci]"
            git pull --rebase || true
            git push || true
          fi

      - name: Download Xray, Hysteria2 & Build HevSocks5Tunnel (ARM64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a

          curl -L --retry 3 -o xray.zip "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-android-arm64-v8a.zip"
          unzip -o xray.zip -d xray_extracted
          mv xray_extracted/xray app/src/main/jniLibs/arm64-v8a/libxray.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libxray.so
          rm -rf xray.zip xray_extracted

          curl -L --retry 3 -o app/src/main/jniLibs/arm64-v8a/libhysteria.so "https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-arm64"
          chmod +x app/src/main/jniLibs/arm64-v8a/libhysteria.so

          git clone --depth 1 --recursive https://github.com/heiher/hev-socks5-tunnel.git hev_tun
          $ANDROID_NDK_LATEST_HOME/ndk-build -C hev_tun APP_ABI=arm64-v8a -j4
          cp hev_tun/libs/arm64-v8a/libhev-socks5-tunnel.so app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so
          rm -rf hev_tun

          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Signed APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiCoreVPN-FullTUN-Signed
          path: app/build/outputs/apk/debug/*.apk
