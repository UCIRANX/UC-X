name: Build MultiCore VPN (Xray + Hysteria2 + Tor + Full TUN)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK 36 & Build Tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - name: Generate Permanent Keystore
        run: |
          mkdir -p keystore
          if [ ! -f "keystore/app.jks" ]; then
            keytool -genkeypair -v -keystore keystore/app.jks -keyalg RSA -keysize 2048 -validity 10000 -alias multivpn -storepass MultiVpnPassword123 -keypass MultiVpnPassword123 -dname "CN=MultiVPN"
          fi

      - name: Download Xray & Hysteria2 Binaries (ARM64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a

          curl -L --retry 3 -o xray.zip "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-android-arm64-v8a.zip"
          unzip -o xray.zip -d xray_extracted
          mv xray_extracted/xray app/src/main/jniLibs/arm64-v8a/libxray.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libxray.so
          rm -rf xray.zip xray_extracted

          curl -L --retry 3 -o app/src/main/jniLibs/arm64-v8a/libhysteria.so "https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-arm64"
          chmod +x app/src/main/jniLibs/arm64-v8a/libhysteria.so

      - name: Download Official hev-socks5-tunnel AAR (Full TUN)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          URL=$(gh api repos/heiher/hev-socks5-tunnel/releases/latest --jq '.assets[] | select(.name | endswith(".aar")) | .browser_download_url' | head -n 1 || true)
          curl -fL --retry 3 "$URL" -o app/libs/hev-socks5-tunnel.aar
          ls -lh app/libs/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Signed APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiCoreVPN-FullTUN-Tor-Signed
          path: app/build/outputs/apk/debug/*.apk
