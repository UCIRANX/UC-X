          write_file("app/src/main/java/com/multivpn/app/security/DeviceIdProvider.kt", r"""
              package com.multivpn.app.security

              import android.annotation.SuppressLint
              import android.content.Context
              import android.os.Build
              import android.provider.Settings
              import java.security.MessageDigest

              object DeviceIdProvider {
                  private const val ALPHABET = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ"

                  @SuppressLint("HardwareIds")
                  fun getCleanDeviceId(context: Context): String {
                      val androidId = Settings.Secure.getString(
                          context.contentResolver,
                          Settings.Secure.ANDROID_ID
                      ) ?: "unknown_id"

                      val rawFingerprint = "$androidId-${Build.BOARD}-${Build.BRAND}-${Build.DEVICE}-${Build.HARDWARE}"
                      val digest = MessageDigest.getInstance("SHA-256").digest(rawFingerprint.toByteArray(Charsets.UTF_8))

                      val sb = StringBuilder(8)
                      for (i in 0 until 8) {
                          val index = (digest[i].toInt() and 0xFF) % ALPHABET.length
                          sb.append(ALPHABET[index])
                      }
                      return sb.toString()
                  }

                  fun getFormattedDeviceId(context: Context): String {
                      val clean = getCleanDeviceId(context)
                      return "${clean.substring(0, 4)}-${clean.substring(4, 8)}"
                  }
              }
          """)

          write_file("app/src/main/java/com/multivpn/app/security/TimeGuard.kt", r"""
              package com.multivpn.app.security

              import android.content.Context
              import android.content.SharedPreferences
              import android.os.SystemClock
              import androidx.security.crypto.EncryptedSharedPreferences
              import androidx.security.crypto.MasterKey
              import kotlinx.coroutines.Dispatchers
              import kotlinx.coroutines.withContext
              import okhttp3.OkHttpClient
              import okhttp3.Request
              import java.text.SimpleDateFormat
              import java.util.Locale
              import java.util.concurrent.TimeUnit
              import kotlin.math.max

              object TimeGuard {
                  private const val PREF_FILE = "secure_time_prefs"
                  private const val KEY_MAX_SEEN_EPOCH = "max_seen_epoch_sec"

                  @Volatile
                  private var anchorNetworkEpochSec: Long = 0L

                  @Volatile
                  private var anchorElapsedRealtimeSec: Long = 0L

                  private val httpClient = OkHttpClient.Builder()
                      .connectTimeout(4, TimeUnit.SECONDS)
                      .readTimeout(4, TimeUnit.SECONDS)
                      .followRedirects(false)
                      .build()

                  private val timeUrls = listOf(
                      "https://www.digikala.com",
                      "https://www.aparat.com",
                      "http://cp.cloudflare.com/generate_204",
                      "https://www.google.com"
                  )

                  fun getSecurePrefs(context: Context): SharedPreferences {
                      return try {
                          val masterKey = MasterKey.Builder(context)
                              .setKeyScheme(MasterKey.KeyScheme.AES256_GCM)
                              .build()
                          EncryptedSharedPreferences.create(
                              context,
                              PREF_FILE,
                              masterKey,
                              EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
                              EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM
                          )
                      } catch (e: Exception) {
                          context.getSharedPreferences(PREF_FILE, Context.MODE_PRIVATE)
                      }
                  }

                  suspend fun syncNetworkTime(context: Context): Boolean = withContext(Dispatchers.IO) {
                      for (url in timeUrls) {
                          try {
                              val request = Request.Builder().url(url).head().build()
                              httpClient.newCall(request).execute().use { response ->
                                  val dateHeader = response.header("Date")
                                  if (!dateHeader.isNullOrBlank()) {
                                      val sdf = SimpleDateFormat("EEE, dd MMM yyyy HH:mm:ss zzz", Locale.US)
                                      val parsedDate = sdf.parse(dateHeader)
                                      if (parsedDate != null) {
                                          val serverSec = parsedDate.time / 1000L
                                          if (serverSec > 1700000000L) {
                                              anchorNetworkEpochSec = serverSec
                                              anchorElapsedRealtimeSec = SystemClock.elapsedRealtime() / 1000L
                                              updateMaxSeenTime(context, serverSec)
                                              return@withContext true
                                          }
                                      }
                                  }
                              }
                          } catch (_: Exception) {
                          }
                      }
                      false
                  }

                  fun isClockTampered(context: Context): Boolean {
                      val prefs = getSecurePrefs(context)
                      val maxSeen = prefs.getLong(KEY_MAX_SEEN_EPOCH, 0L)
                      val currentWallSec = System.currentTimeMillis() / 1000L

                      if (anchorNetworkEpochSec > 0L) return false
                      if (maxSeen > 0L && currentWallSec + 300L < maxSeen) return true

                      updateMaxSeenTime(context, currentWallSec)
                      return false
                  }

                  fun getCurrentVerifiedTimeSec(context: Context): Long {
                      val nowElapsedSec = SystemClock.elapsedRealtime() / 1000L
                      val currentWallSec = System.currentTimeMillis() / 1000L
                      val prefs = getSecurePrefs(context)
                      val maxSeen = prefs.getLong(KEY_MAX_SEEN_EPOCH, 0L)

                      val estimatedSec = if (anchorNetworkEpochSec > 0L) {
                          anchorNetworkEpochSec + (nowElapsedSec - anchorElapsedRealtimeSec)
                      } else {
                          max(currentWallSec, maxSeen)
                      }

                      updateMaxSeenTime(context, estimatedSec)
                      return estimatedSec
                  }

                  private fun updateMaxSeenTime(context: Context, newTimeSec: Long) {
                      val prefs = getSecurePrefs(context)
                      val currentMax = prefs.getLong(KEY_MAX_SEEN_EPOCH, 0L)
                      if (newTimeSec > currentMax) {
                          prefs.edit().putLong(KEY_MAX_SEEN_EPOCH, newTimeSec).apply()
                      }
                  }
              }
          """)

          write_file("app/src/main/java/com/multivpn/app/security/LicenseManager.kt", r"""
              package com.multivpn.app.security

              import android.content.Context
              import android.util.Base64
              import java.nio.ByteBuffer
              import javax.crypto.Mac
              import javax.crypto.spec.SecretKeySpec

              sealed class LicenseStatus {
                  data class Valid(val remainingSeconds: Long, val expiryEpochSec: Long) : LicenseStatus()
                  data class Expired(val message: String) : LicenseStatus()
                  data class Invalid(val reason: String) : LicenseStatus()
                  object Missing : LicenseStatus()
              }

              object LicenseManager {
                  private const val KEY_SAVED_TOKEN = "saved_license_token"
                  private const val SECRET_KEY_HEX = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

                  private fun hexToBytes(hex: String): ByteArray {
                      val len = hex.length
                      val data = ByteArray(len / 2)
                      var i = 0
                      while (i < len) {
                          data[i / 2] = ((Character.digit(hex[i], 16) shl 4) + Character.digit(hex[i + 1], 16)).toByte()
                          i += 2
                      }
                      return data
                  }

                  fun verifyAndSaveToken(context: Context, rawInput: String): LicenseStatus {
                      val status = verifyTokenInternal(context, rawInput)
                      if (status is LicenseStatus.Valid) {
                          TimeGuard.getSecurePrefs(context)
                              .edit()
                              .putString(KEY_SAVED_TOKEN, rawInput.trim())
                              .apply()
                      }
                      return status
                  }

                  fun getCurrentLicenseStatus(context: Context): LicenseStatus {
                      val saved = TimeGuard.getSecurePrefs(context).getString(KEY_SAVED_TOKEN, null)
                      if (saved.isNullOrBlank()) return LicenseStatus.Missing
                      return verifyTokenInternal(context, saved)
                  }

                  private fun verifyTokenInternal(context: Context, rawInput: String): LicenseStatus {
                      if (TimeGuard.isClockTampered(context)) {
                          return LicenseStatus.Invalid("ساعت گوشی به عقب کشیده شده است! لطفاً تاریخ و ساعت گوشی را به حالت خودکار برگردانید.")
                      }

                      val cleaned = rawInput.trim().removePrefix("MV2-").removePrefix("mv2-").removePrefix("MV1-").removePrefix("mv1-")
                      val decoded: ByteArray = try {
                          Base64.decode(cleaned, Base64.URL_SAFE or Base64.NO_WRAP or Base64.NO_PADDING)
                      } catch (e: Exception) {
                          return LicenseStatus.Invalid("فرمت کد وارد شده نامعتبر است.")
                      }

                      if (decoded.size != 48) {
                          return LicenseStatus.Invalid("طول کد لایسنس صحیح نیست.")
                      }

                      val payload = decoded.copyOfRange(0, 16)
                      val signature = decoded.copyOfRange(16, 48)

                      val isSignatureValid = try {
                          val secretBytes = hexToBytes(SECRET_KEY_HEX)
                          val mac = Mac.getInstance("HmacSHA256")
                          mac.init(SecretKeySpec(secretBytes, "HmacSHA256"))
                          val computedSig = mac.doFinal(payload)
                          computedSig.contentEquals(signature)
                      } catch (e: Exception) {
                          false
                      }

                      if (!isSignatureValid) {
                          return LicenseStatus.Invalid("امضای دیجیتال کد نامعتبر است یا دستکاری شده است.")
                      }

                      val tokenDeviceId = String(payload, 0, 8, Charsets.US_ASCII).trim()
                      val myDeviceId = DeviceIdProvider.getCleanDeviceId(context)

                      if (!tokenDeviceId.equals(myDeviceId, ignoreCase = true)) {
                          return LicenseStatus.Invalid("این کد متعلق به این گوشی نیست! (قفل تک‌دستگاهی)")
                      }

                      val expiryEpoch = ByteBuffer.wrap(payload, 8, 8).long
                      val nowSec = TimeGuard.getCurrentVerifiedTimeSec(context)

                      val remaining = expiryEpoch - nowSec
                      return if (remaining <= 0L) {
                          LicenseStatus.Expired("مهلت استفاده ۵ روزه این کد تمام شده است. لطفاً از ربات تلگرام کد جدید بگیرید.")
                      } else {
                          LicenseStatus.Valid(remainingSeconds = remaining, expiryEpochSec = expiryEpoch)
                      }
                  }

                  fun formatRemainingTime(seconds: Long): String {
                      if (seconds <= 0) return "منقضی شده"
                      val days = seconds / 86400
                      val hours = (seconds % 86400) / 3600
                      val mins = (seconds % 3600) / 60
                      val secs = seconds % 60
                      return "${days} روز و ${hours} ساعت و ${mins} دقیقه و ${secs} ثانیه"
                  }
              }
          """)

          write_file("app/src/main/java/com/multivpn/app/sub/DohClient.kt", r"""
              package com.multivpn.app.sub

              import kotlinx.coroutines.Dispatchers
              import kotlinx.coroutines.withContext
              import okhttp3.HttpUrl.Companion.toHttpUrl
              import okhttp3.OkHttpClient
              import okhttp3.Request
              import okhttp3.dnsoverhttps.DnsOverHttps
              import java.net.InetAddress
              import java.util.concurrent.TimeUnit

              object DohClient {
                  private val bootstrapClient = OkHttpClient.Builder()
                      .connectTimeout(8, TimeUnit.SECONDS)
                      .readTimeout(8, TimeUnit.SECONDS)
                      .build()

                  private val dohDns = DnsOverHttps.Builder()
                      .client(bootstrapClient)
                      .url("https://1.1.1.1/dns-query".toHttpUrl())
                      .bootstrapDnsHosts(
                          InetAddress.getByName("1.1.1.1"),
                          InetAddress.getByName("1.0.0.1"),
                          InetAddress.getByName("8.8.8.8")
                      )
                      .build()

                  private val dohHttpClient = bootstrapClient.newBuilder()
                      .dns(dohDns)
                      .build()

                  suspend fun fetchUrlText(url: String): String = withContext(Dispatchers.IO) {
                      val req = Request.Builder()
                          .url(url)
                          .header("User-Agent", "MultiCoreVPN/2.2 (Android; Sing-box; Xray)")
                          .build()

                      try {
                          dohHttpClient.newCall(req).execute().use { resp ->
                              if (!resp.isSuccessful) throw Exception("HTTP ${resp.code}")
                              resp.body?.string() ?: throw Exception("پاسخ خالی از سرور")
                          }
                      } catch (e: Exception) {
                          bootstrapClient.newCall(req).execute().use { resp ->
                              if (!resp.isSuccessful) throw Exception("HTTP ${resp.code}")
                              resp.body?.string() ?: throw Exception("پاسخ خالی از سرور")
                          }
                      }
                  }
              }
          """)

          write_file("app/src/main/java/com/multivpn/app/sub/SubManager.kt", r"""
              package com.multivpn.app.sub

              import android.content.Context
              import android.util.Base64
              import com.multivpn.app.security.TimeGuard
              import org.json.JSONObject
              import java.net.URLDecoder
              import java.util.UUID

              data class VpnConfig(
                  val id: String = UUID.randomUUID().toString(),
                  val name: String,
                  val coreType: String,
                  val protocol: String,
                  val host: String,
                  val port: Int,
                  val rawConfig: String,
                  var pingMs: Long = -1L
              )

              object SubManager {
                  private const val KEY_CACHED_RAW_SUB = "cached_raw_sub_content"

                  // <<< آدرس ساب‌لینک خودت را اینجا بگذار >>>
                  private val SUBSCRIPTION_URLS = listOf(
                      "https://raw.githubusercontent.com/UCIRANX/Vpn/refs/heads/main/UcSubot.txt"
                  )

                  fun loadCachedConfigs(context: Context): List<VpnConfig> {
                      val cached = TimeGuard.getSecurePrefs(context).getString(KEY_CACHED_RAW_SUB, null)
                      return if (!cached.isNullOrBlank()) parseRawSubscription(cached) else emptyList()
                  }

                  fun loadCachedOrSampleConfigs(context: Context): List<VpnConfig> = loadCachedConfigs(context)

                  suspend fun fetchAndParseSub(context: Context): List<VpnConfig> {
                      val combinedRaw = StringBuilder()
                      for (url in SUBSCRIPTION_URLS) {
                          try {
                              val text = DohClient.fetchUrlText(url)
                              combinedRaw.append(decodeSubscriptionText(text)).append("\n")
                          } catch (_: Exception) {
                          }
                      }
                      val finalRaw = combinedRaw.toString()
                      if (finalRaw.isBlank()) {
                          throw Exception("عدم دسترسی به سرور ساب‌لینک")
                      }
                      val configs = parseRawSubscription(finalRaw)
                      if (configs.isNotEmpty()) {
                          TimeGuard.getSecurePrefs(context).edit().putString(KEY_CACHED_RAW_SUB, finalRaw).apply()
                      }
                      return configs
                  }

                  private fun decodeSubscriptionText(rawText: String): String {
                      val trimmed = rawText.trim()
                      if (trimmed.contains("://")) return trimmed
                      val cleanB64 = trimmed.filterNot { it.isWhitespace() }
                      val padded = cleanB64.padEnd((cleanB64.length + 3) / 4 * 4, '=')
                      return try {
                          String(Base64.decode(padded, Base64.DEFAULT), Charsets.UTF_8)
                      } catch (_: Exception) {
                          try {
                              String(Base64.decode(padded, Base64.URL_SAFE), Charsets.UTF_8)
                          } catch (_: Exception) {
                              trimmed
                          }
                      }
                  }

                  fun parseRawSubscription(rawText: String): List<VpnConfig> {
                      val decodedContent = decodeSubscriptionText(rawText)
                      val list = mutableListOf<VpnConfig>()

                      for (rawLine in decodedContent.lines()) {
                          val line = rawLine.trim()
                          if (line.isEmpty() || line.startsWith("#") || line.startsWith("//")) continue

                          val parsed = when {
                              line.startsWith("vless://", ignoreCase = true) -> parseGenericUri(line, "vless", "Sing-box (Xray)")
                              line.startsWith("ss://", ignoreCase = true) -> parseShadowsocksUri(line)
                              line.startsWith("hy2://", ignoreCase = true) -> parseGenericUri(line, "hy2", "Sing-box (Xray)")
                              line.startsWith("hysteria2://", ignoreCase = true) -> parseGenericUri(line, "hy2", "Sing-box (Xray)")
                              line.startsWith("vmess://", ignoreCase = true) -> parseVmess(line)
                              line.startsWith("trojan://", ignoreCase = true) -> parseGenericUri(line, "trojan", "Sing-box (Xray)")
                              line.startsWith("tuic://", ignoreCase = true) -> parseGenericUri(line, "tuic", "Sing-box (Xray)")
                              line.startsWith("awg://", ignoreCase = true) ||
                              line.startsWith("wg://", ignoreCase = true) ||
                              line.startsWith("wireguard://", ignoreCase = true) -> parseGenericUri(line, "awg", "AmneziaWG")
                              line.startsWith("ovpn://", ignoreCase = true) -> parseGenericUri(line, "ovpn", "OpenVPN")
                              else -> null
                          }

                          if (parsed != null) {
                              list.add(parsed)
                          }
                      }
                      return list
                  }

                  private fun parseGenericUri(uriStr: String, protocol: String, coreType: String): VpnConfig? {
                      return try {
                          val withoutScheme = uriStr.substringAfter("://")
                          val mainPart = withoutScheme.substringBefore("#")
                          val rawFragment = if (withoutScheme.contains("#")) withoutScheme.substringAfterLast("#") else ""

                          val remark = if (rawFragment.isNotBlank()) {
                              try { URLDecoder.decode(rawFragment, "UTF-8") } catch (_: Exception) { rawFragment }
                          } else ""

                          val authorityAndPath = mainPart.substringBefore("?")
                          val hostPortPart = if (authorityAndPath.contains("@")) {
                              authorityAndPath.substringAfterLast("@")
                          } else {
                              authorityAndPath
                          }.substringBefore("/")

                          val host: String
                          val port: Int

                          if (hostPortPart.startsWith("[")) {
                              host = hostPortPart.substringBefore("]") + "]"
                              port = hostPortPart.substringAfter("]:", "443").toIntOrNull() ?: 443
                          } else {
                              host = hostPortPart.substringBefore(":").trim()
                              port = hostPortPart.substringAfter(":", "443").toIntOrNull() ?: 443
                          }

                          if (host.isBlank()) return null

                          val finalName = remark.ifBlank { "${protocol.uppercase()} - $host:$port" }.take(45)
                          VpnConfig(
                              name = finalName,
                              coreType = coreType,
                              protocol = protocol,
                              host = host,
                              port = port,
                              rawConfig = uriStr
                          )
                      } catch (_: Exception) {
                          null
                      }
                  }

                  private fun parseShadowsocksUri(uriStr: String): VpnConfig? {
                      return try {
                          val withoutScheme = uriStr.substringAfter("://")
                          val mainPart = withoutScheme.substringBefore("#").substringBefore("?")
                          val rawFragment = if (withoutScheme.contains("#")) withoutScheme.substringAfterLast("#") else ""
                          val remark = if (rawFragment.isNotBlank()) {
                              try { URLDecoder.decode(rawFragment, "UTF-8") } catch (_: Exception) { rawFragment }
                          } else ""

                          val hostPortPart = if (mainPart.contains("@")) {
                              mainPart.substringAfterLast("@").substringBefore("/")
                          } else {
                              val b64 = try { URLDecoder.decode(mainPart.substringBefore("/").trim(), "UTF-8") } catch (_: Exception) { mainPart.substringBefore("/").trim() }
                              val padded = b64.padEnd((b64.length + 3) / 4 * 4, '=')
                              val decoded = try {
                                  String(Base64.decode(padded, Base64.URL_SAFE), Charsets.UTF_8)
                              } catch (_: Exception) {
                                  String(Base64.decode(padded, Base64.DEFAULT), Charsets.UTF_8)
                              }
                              decoded.substringAfterLast("@")
                          }

                          val host = hostPortPart.substringBefore(":").trim()
                          val port = hostPortPart.substringAfter(":", "443").toIntOrNull() ?: 443
                          if (host.isBlank()) return null

                          val finalName = remark.ifBlank { "SS - $host:$port" }.take(45)
                          VpnConfig(
                              name = finalName,
                              coreType = "Sing-box (Xray)",
                              protocol = "ss",
                              host = host,
                              port = port,
                              rawConfig = uriStr
                          )
                      } catch (_: Exception) {
                          null
                      }
                  }

                  private fun parseVmess(uriStr: String): VpnConfig? {
                      return try {
                          val b64 = uriStr.substringAfter("://").trim()
                          val padded = b64.padEnd((b64.length + 3) / 4 * 4, '=')
                          val jsonStr = try {
                              String(Base64.decode(padded, Base64.DEFAULT), Charsets.UTF_8)
                          } catch (_: Exception) {
                              String(Base64.decode(padded, Base64.URL_SAFE), Charsets.UTF_8)
                          }
                          val json = JSONObject(jsonStr)
                          val host = json.optString("add", "").trim()
                          val port = json.optString("port", "443").toIntOrNull() ?: json.optInt("port", 443)
                          val name = json.optString("ps", "VMess-$host").ifBlank { "VMess-$host" }
                          if (host.isBlank()) null else VpnConfig(
                              name = name.take(45),
                              coreType = "Sing-box (Xray)",
                              protocol = "vmess",
                              host = host,
                              port = port,
                              rawConfig = uriStr
                          )
                      } catch (_: Exception) {
                          null
                      }
                  }
              }
          """)

          write_file("app/src/main/java/com/multivpn/app/sub/PingTester.kt", r"""
              package com.multivpn.app.sub

              import kotlinx.coroutines.Dispatchers
              import kotlinx.coroutines.async
              import kotlinx.coroutines.awaitAll
              import kotlinx.coroutines.coroutineScope
              import kotlinx.coroutines.sync.Semaphore
              import kotlinx.coroutines.sync.withPermit
              import kotlinx.coroutines.withContext
              import java.net.InetSocketAddress
              import java.net.Socket

              object PingTester {
                  private val semaphore = Semaphore(10)

                  suspend fun measureTcpPing(host: String, port: Int, timeoutMs: Int = 2500): Long = withContext(Dispatchers.IO) {
                      try {
                          val start = System.currentTimeMillis()
                          Socket().use { socket ->
                              socket.connect(InetSocketAddress(host.removeSurrounding("[", "]"), port), timeoutMs)
                          }
                          val elapsed = System.currentTimeMillis() - start
                          if (elapsed <= 0L) 1L else elapsed
                      } catch (e: Exception) {
                          -2L
                      }
                  }

                  suspend fun pingAllConfigs(configs: List<VpnConfig>): List<VpnConfig> = coroutineScope {
                      val jobs = configs.map { cfg ->
                          async(Dispatchers.IO) {
                              semaphore.withPermit {
                                  val latency = measureTcpPing(cfg.host, cfg.port)
                                  cfg.copy(pingMs = latency)
                              }
                          }
                      }
                      val results = jobs.awaitAll()
                      results.sortedWith(compareBy {
                          when {
                              it.pingMs > 0 -> it.pingMs
                              it.pingMs == -1L -> 999998L
                              else -> 999999L
                          }
                      })
                  }
              }
          """)

