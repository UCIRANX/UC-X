              class MultiCoreVpnService : VpnService() {
                  private val serviceScope = CoroutineScope(Dispatchers.Default + SupervisorJob())
                  private var vpnInterface: ParcelFileDescriptor? = null
                  private var isTProxyRunning = false

                  override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                      val coreName = intent?.getStringExtra("CORE_NAME") ?: "Sing-box (Xray)"
                      val serverName = intent?.getStringExtra("SERVER_NAME") ?: "Server"
                      val serverPing = intent?.getLongExtra("SERVER_PING", -1L) ?: -1L

                      startVpnForegroundNotification(coreName, serverName, serverPing)
                      establishFullTunnel(serverName)
                      startExpirationWatchdog()
                      return START_STICKY
                  }

                  private fun establishFullTunnel(serverName: String) {
                      try {
                          stopTunnelOnly()
                          val builder = Builder()
                              .setSession("MultiCoreVPN - $serverName")
                              .setMtu(1500)
                              .addAddress("10.10.0.2", 24)
                              .addRoute("0.0.0.0", 0)
                              .addDnsServer("1.1.1.1")
                              .addDnsServer("8.8.8.8")

                          // استثنا کردن خود اپلیکیشن برای جلوگیری از افتادن ترافیک Xray داخل حلقه VPN
                          try {
                              builder.addDisallowedApplication(packageName)
                          } catch (_: Exception) {
                          }

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              builder.setHttpProxy(
                                  ProxyInfo.buildDirectProxy("127.0.0.1", CoreConfigGenerator.LOCAL_HTTP_PORT)
                              )
                          }

                          vpnInterface = builder.establish()
                          val pfd = vpnInterface ?: return

                          // راه‌اندازی موتور JNI hev-socks5-tunnel برای عبور اتوماتیک ترافیک تلگرام و کل اپ‌ها
                          val tproxyConf = File(filesDir, "tproxy.yml")
                          tproxyConf.writeText(CoreConfigGenerator.buildHevTunYaml(), Charsets.UTF_8)
                          TProxyService.TProxyStartService(tproxyConf.absolutePath, pfd.fd)
                          isTProxyRunning = true
                      } catch (_: Throwable) {
                      }
                  }

                  private fun startVpnForegroundNotification(coreName: String, serverName: String, ping: Long) {
                      val channelId = "vpn_active_channel"
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val channel = NotificationChannel(channelId, "وضعیت اتصال فیلترشکن", NotificationManager.IMPORTANCE_LOW)
                          nm.createNotificationChannel(channel)
                      }
                      val pendingIntent = PendingIntent.getActivity(
                          this, 0, Intent(this, MainActivity::class.java),
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      val pingText = if (ping > 0) " (${ping}ms)" else ""
                      val notification = NotificationCompat.Builder(this, channelId)
                          .setSmallIcon(android.R.drawable.ic_lock_lock)
                          .setContentTitle("متصل به $coreName (Full TUN)")
                          .setContentText("سرور: $serverName$pingText")
                          .setContentIntent(pendingIntent)
                          .setOngoing(true)
                          .build()
                      startForeground(1001, notification)
                  }

                  private fun startExpirationWatchdog() {
                      serviceScope.coroutineContext.cancelChildren()
                      serviceScope.launch {
                          while (isActive) {
                              val status = LicenseManager.getCurrentLicenseStatus(applicationContext)
                              if (status !is LicenseStatus.Valid) {
                                  sendExpirationNotification()
                                  stopTunnel()
                                  stopSelf()
                                  break
                              }
                              delay(5000L)
                          }
                      }
                  }

                  private fun stopTunnelOnly() {
                      try {
                          if (isTProxyRunning) {
                              TProxyService.TProxyStopService()
                              isTProxyRunning = false
                          }
                      } catch (_: Throwable) {
                      }
                      try {
                          vpnInterface?.close()
                          vpnInterface = null
                      } catch (_: Exception) {
                      }
                  }

                  private fun stopTunnel() {
                      try {
                          CoreEngineRunner.stopCore()
                          stopTunnelOnly()
                      } catch (_: Exception) {
                      }
                  }

                  private fun sendExpirationNotification() {
                      val channelId = "vpn_expiry_alert"
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val channel = NotificationChannel(channelId, "هشدار انقضای کد ۵ روزه", NotificationManager.IMPORTANCE_HIGH)
                          nm.createNotificationChannel(channel)
                      }
                      val notification = NotificationCompat.Builder(this, channelId)
                          .setSmallIcon(android.R.drawable.ic_dialog_alert)
                          .setContentTitle("مهلت ۵ روزه به پایان رسید")
                          .setContentText("اتصال فیلترشکن قطع شد. لطفاً کد جدید را از ربات تلگرام دریافت و وارد کنید.")
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setAutoCancel(true)
                          .build()
                      nm.notify(1002, notification)
                  }

                  override fun onDestroy() {
                      stopTunnel()
                      serviceScope.cancel()
                      super.onDestroy()
                  }

                  override fun onRevoke() {
                      stopTunnel()
                      serviceScope.cancel()
                      super.onRevoke()
                      stopSelf()
                  }
              }
          """)

          # 6. در نهایت، تمیز کردن خودِ فایل build.yml تا در دفعات بعدی هیچ فایلی را بازنویسی نکند!
          write_file(".github/workflows/build.yml", r"""
              name: Build Clean MultiCore VPN

              on:
                push:
                  branches: [ "main", "master" ]
                workflow_dispatch:

              permissions:
