name: Auto Build MultiCore VPN (Phase 4 - Real Xray Core Engine)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write Phase 4 Project Files
        shell: python
        run: |
          import os

          def write_file(path, content):
              os.makedirs(os.path.dirname(path) if os.path.dirname(path) else ".", exist_ok=True)
              lines = content.strip("\n").split("\n")
              non_empty = [l for l in lines if l.strip()]
              min_indent = min((len(l) - len(l.lstrip())) for l in non_empty) if non_empty else 0
              cleaned = "\n".join(l[min_indent:] if len(l) >= min_indent else l for l in lines)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(cleaned + "\n")

          print("Generating Phase 4 files (Real Xray Core Runner, JSON Config Generator, Tun Service)...")

          write_file("gradle.properties", r"""
              org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
              android.useAndroidX=true
              kotlin.code.style=official
              android.nonTransitiveRClass=true
          """)

          write_file("settings.gradle.kts", r"""
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                  repositories {
                      google()
                      mavenCentral()
                      maven { url = uri("https://jitpack.io") }
                  }
              }
              rootProject.name = "MultiCoreVPN"
              include(":app")
          """)

          write_file("build.gradle.kts", r"""
              plugins {
                  id("com.android.application") version "8.5.2" apply false
                  id("org.jetbrains.kotlin.android") version "2.0.21" apply false
                  id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              }
          """)

          write_file("app/build.gradle.kts", r"""
              plugins {
                  id("com.android.application")
                  id("org.jetbrains.kotlin.android")
                  id("org.jetbrains.kotlin.plugin.compose")
              }

              val runNumber = System.getenv("GITHUB_RUN_NUMBER")?.toIntOrNull() ?: 1

              android {
                  namespace = "com.multivpn.app"
                  compileSdk = 34

                  defaultConfig {
                      applicationId = "com.multivpn.app"
                      minSdk = 24
                      targetSdk = 34
                      versionCode = runNumber + 500
                      versionName = "2.0.$runNumber"

                      ndk {
                          abiFilters += listOf("arm64-v8a")
                      }
                  }

                  signingConfigs {
                      create("permanentSign") {
                          storeFile = rootProject.file("keystore/app.jks")
                          storePassword = "MultiVpnPassword123"
                          keyAlias = "multivpn"
                          keyPassword = "MultiVpnPassword123"
                      }
                  }

                  buildTypes {
                      debug {
                          signingConfig = signingConfigs.getByName("permanentSign")
                      }
                      release {
                          isMinifyEnabled = false
                          signingConfig = signingConfigs.getByName("permanentSign")
                      }
                  }

                  packaging {
                      jniLibs {
                          useLegacyPackaging = true
                      }
                  }

                  compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }

                  kotlinOptions {
                      jvmTarget = "17"
                  }

                  buildFeatures {
                      compose = true
                  }
              }

              dependencies {
                  val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
                  implementation(composeBom)
                  implementation("androidx.activity:activity-compose:1.9.0")
                  implementation("androidx.compose.ui:ui")
                  implementation("androidx.compose.foundation:foundation")
                  implementation("androidx.compose.material3:material3")
                  implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
                  implementation("androidx.core:core-ktx:1.13.1")
                  implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
                  implementation("com.squareup.okhttp3:okhttp:4.12.0")
                  implementation("com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0")
                  implementation("androidx.security:security-crypto:1.1.0-alpha06")
              }
          """)

          write_file("app/src/main/AndroidManifest.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                  <uses-permission android:name="android.permission.INTERNET" />
                  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
